<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Device Trust · Demo Bank</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #141c2b; background: #f5f6f2; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 620px); }
    .eyebrow { margin: 0 0 8px; color: #2b59d9; font-size: 12px; font-weight: 800; letter-spacing: .12em; }
    h1 { margin: 0 0 28px; font-size: clamp(32px, 7vw, 48px); letter-spacing: -.04em; }
    label { display: block; color: #4b5567; font-size: 13px; margin-bottom: 7px; }
    input { width: 100%; border: 1px solid #cbd2c8; border-radius: 12px; background: #fff; padding: 13px 14px; font: inherit; }
    .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
    button { border: 0; border-radius: 12px; padding: 13px 12px; font: inherit; font-weight: 700; color: #fff; background: #2b59d9; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    .card { display: flex; align-items: center; gap: 18px; margin-top: 26px; padding: 20px; background: #fff; border: 1px solid #dde1da; border-radius: 18px; }
    .level { display: grid; place-items: center; flex: 0 0 76px; height: 76px; border-radius: 15px; background: #eef0eb; font-size: 34px; font-weight: 800; }
    .title { margin: 0 0 5px; font-size: 19px; font-weight: 800; }
    .detail { margin: 0; color: #4b5567; font-size: 13px; line-height: 1.45; }
    .note { margin: 16px 0 0; color: #657083; font-size: 12px; line-height: 1.5; }
    a { color: #2b59d9; }
    @media (max-width: 520px) { .actions { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">DEVICE TRUST POC</p>
    <h1>Demo Bank</h1>
    <label for="server">Assessment server</label>
    <input id="server" autocomplete="url">
    <div class="actions">
      <button data-action="login">Log in</button>
      <button data-action="add_payee">Add payee</button>
      <button data-action="transfer">Transfer ₹5,000</button>
    </div>
    <section class="card" aria-live="polite">
      <div class="level" id="level">–</div>
      <div>
        <p class="title" id="title">Tap an action to assess this device</p>
        <p class="detail" id="detail"></p>
      </div>
    </section>
    <p class="note">This browser client uses the backend's reduced-assurance probe scorer. Android hardware key attestation is available only in the native app. <a href="/" target="_blank" rel="noreferrer">Open live dashboard</a>.</p>
  </main>
  <script>
    const labels = {1: "Genuine", 2: "Normal", 3: "Suspicious", 4: "High risk", 5: "Critical"};
    const outcomes = {1: "Allowed", 2: "Allowed", 3: "Step-up required", 4: "Blocked", 5: "Blocked"};
    const colors = {1: "#1e40af", 2: "#93a9ee", 3: "#d5d9e0", 4: "#f4b183", 5: "#c2410c"};
    const server = document.querySelector("#server");
    server.value = localStorage.getItem("trust-server") || location.origin;
    server.addEventListener("change", () => localStorage.setItem("trust-server", server.value.trim().replace(/\\/$/, "")));
    const browserProbes = () => ({
      emu_qemu_props: /Android Emulator|sdk_gphone|generic/i.test(navigator.userAgent),
      ctx_developer_options: false,
      ctx_adb_enabled: false,
      ctx_vpn: false,
      rt_debugger_connected: false,
      sensor_count: Math.min(60, (navigator.hardwareConcurrency || 1) + 10)
    });
    async function assess(action) {
      const buttons = [...document.querySelectorAll("button")];
      buttons.forEach(b => b.disabled = true);
      document.querySelector("#title").textContent = "Assessing…";
      document.querySelector("#detail").textContent = "";
      try {
        const base = server.value.trim().replace(/\\/$/, "");
        const res = await fetch(base + "/v1/predict", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({probes: browserProbes(), slowdown: 1, failed: 0}) });
        if (!res.ok) throw new Error("Server returned " + res.status);
        const r = await res.json();
        const level = r.level || 1;
        const box = document.querySelector("#level");
        box.textContent = level; box.style.background = colors[level]; box.style.color = [1,5].includes(level) ? "#f7f9ff" : "#141c2b";
        document.querySelector("#title").textContent = `Level ${level} · ${labels[level]}`;
        document.querySelector("#detail").textContent = `${outcomes[level]} · rules ${r.rules_level ?? "–"} · ML ${r.ml_level ?? "–"} · ${action.replace("_", " ")}`;
      } catch (e) {
        document.querySelector("#level").textContent = "!";
        document.querySelector("#title").textContent = "Could not reach the server";
        document.querySelector("#detail").textContent = e.message;
      } finally { buttons.forEach(b => b.disabled = false); }
    }
    document.querySelectorAll("button").forEach(b => b.addEventListener("click", () => assess(b.dataset.action)));
  </script>
</body>
</html>
