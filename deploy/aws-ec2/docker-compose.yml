# Device-trust collector on one EC2 instance: nginx (port 80) -> uvicorn/FastAPI -> Neon Postgres.
#
#   cd deploy/aws-ec2
#   cp .env.example .env        # fill in DATABASE_URL, the rest is generated by setup-ec2.sh
#   docker compose up -d --build
#
# Retrain the model on real sessions from the database (writes to the "models" volume):
#   docker compose run --rm retrain && docker compose restart app
#
# See README.md in this folder.

name: rasp-ml

services:
  app:
    build:
      context: ../../backend
      args:
        GEO_DATA: "1"              # download country / ASN / Tor data at build time (F286-F294, F340, F290)
    image: rasp-ml-collector:latest
    # uvicorn is the server; WEB_CONCURRENCY (from .env) sets the worker processes.
    # No --proxy-headers: the app reads X-Forwarded-For itself (TRUST_PROXY=1).
    command: >-
      uvicorn app:app --host 0.0.0.0 --port 8000
      --workers ${WEB_CONCURRENCY:-2} --timeout-keep-alive 75 --no-proxy-headers
    env_file: .env
    environment:
      TRUST_PROXY: "1"             # nginx (and Cloudflare / an ALB, if used) is in front
      MODEL_DIR: /models           # a retrained model, if any; otherwise the one built into the image
    volumes:
      - models:/models
      - roots:/app/data/attestation_roots   # Google attestation roots cache, survives restarts
    expose:
      - "8000"                     # only nginx reaches the app; nothing is published on the host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # One-off: retrain on synthetic data + the real low-risk sessions in the database.
  # Runs the same image, so the model always matches the installed scikit-learn and features.
  retrain:
    image: rasp-ml-collector:latest
    profiles: ["tools"]
    command: python train_shadow.py
    env_file: .env
    environment:
      MODEL_DIR: /models
    volumes:
      - models:/models

volumes:
  models:
  roots:
