# nginx in front of the collector (mounted as /etc/nginx/conf.d/default.conf, inside http {}).
#
# Plain HTTP on port 80. Release builds of the app only talk HTTPS, so terminate TLS in front of
# this box (Cloudflare proxied DNS, or an AWS ALB with an ACM certificate), or add a 443 server
# with your own certificate: see https.conf.example. No certbot here, by design.

# 10 requests / second per client IP, short bursts allowed. The app sends 2 per tap
# (GET /v1/challenge + POST /v1/collect).
limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;
limit_req_status 429;

upstream collector {
    server app:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    client_max_body_size 300k;          # the app accepts 256 KB (MAX_BODY_KB) and answers 413 itself
    client_body_timeout 30s;

    location / {
        limit_req zone=per_ip burst=20 nodelay;

        proxy_pass http://collector;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Appends the address nginx received the request from. The app walks this header from
        # the right and skips private / Cloudflare hops, so it finds the phone's real IP.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # health check for a load balancer / uptime monitor, without rate limiting
    location = /health {
        proxy_pass http://collector;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }
}
